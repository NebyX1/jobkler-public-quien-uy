<!doctype html>
<html lang="es" data-theme="quienLight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quien.uy — Encontrá quién puede hacerlo. Profesionales, oficios y servicios cerca de vos en Uruguay." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Quien.uy — Encontrá quién puede hacerlo</title>
    <script>
      // Prevent flash of wrong theme: set data-theme before React hydrates
      (function() {
        var saved = localStorage.getItem('quien-theme');
        var theme = 'quienLight';
        if (saved === 'quienLight' || saved === 'quienDark') {
          theme = saved;
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'quienDark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
